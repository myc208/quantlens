name: Sync macro calendar

# Once a month, refresh scripts/macro_calendar.json from public sources and propose the
# result as a pull request for a person to review. Nothing is committed to the default
# branch by this workflow, and the daily market-data job never makes these requests: it
# keeps reading the committed file.
#
#   FOMC            the Fed's FOMC calendar page
#   CPI             FRED release dates (repository secret FRED_API_KEY, free from
#                   https://fred.stlouisfed.org/docs/api/api_key.html). Without the secret,
#                   or if FRED fails, the CPI dates already in the file are kept.
#   US closures     exchange_calendars (pinned in scripts/requirements-calendar.txt)
#   SG holidays     data.gov.sg; SGX half days by rule
#
# A source that fails keeps its existing entries, and the pull request says so. The merged
# file must pass the pipeline's own calendar validation, then both test gates, before a
# pull request is opened.
#
# One-time setup: Settings -> Actions -> General -> Workflow permissions -> tick
# "Allow GitHub Actions to create and approve pull requests". A pull request opened with
# the workflow's token does not start the Test workflow on its own; both gates run here
# instead, and closing and reopening the pull request runs them again in CI.

on:
  schedule:
    # 06:00 UTC on the 1st of each month (14:00 in Singapore).
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-macro-calendar
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  SYNC_BRANCH: automation/macro-calendar

jobs:
  sync:
    name: Refresh the macro calendar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-calendar.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt -r scripts/requirements-calendar.txt

      # Exits 1, and writes nothing, if the merged calendar fails validation.
      - name: Sync the calendar from its sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_macro_calendar.py --summary "$RUNNER_TEMP/calendar-sync.md"

      - name: Did anything change from today on?
        id: diff
        run: |
          if git diff --quiet -- scripts/macro_calendar.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The calendar is up to date; no pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Gate 1: pipeline unit tests"
        if: steps.diff.outputs.changed == 'true'
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: "Gate 2: browser test suite"
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/run_browser_tests.py --min-tests 100

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add scripts/macro_calendar.json
          git commit -m "data: sync the macro calendar ($(date -u +%Y-%m-%d))"
          git push --force origin "$SYNC_BRANCH"
          {
            cat "$RUNNER_TEMP/calendar-sync.md"
            echo
            echo "Both test gates passed in the workflow run that opened this pull request. Review the FOMC and CPI dates against the linked sources before merging."
          } > "$RUNNER_TEMP/pr-body.md"
          if [ "$(gh pr view "$SYNC_BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$SYNC_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "$BASE" --head "$SYNC_BRANCH" \
              --title "data: sync the macro calendar ($(date -u +%Y-%m))" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
