name: Update market data and deploy

# One workflow, two jobs:
#   refresh - pulls fresh data from Yahoo Finance (no API key) and commits
#             data/market_snapshot.json. Runs on the daily schedule and on demand.
#   deploy  - publishes the static site to GitHub Pages. Runs after every
#             successful refresh and on every push to the default branch.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  schedule:
    # 22:30 UTC every day (06:30 SGT). After the US close in both EST and EDT,
    # and long after the SGX close. Runs at weekends too, for crypto candles.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: "Deploy the site without refreshing market data"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: market-data-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh market snapshot
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install yfinance
        # Deliberately unpinned: when Yahoo changes its endpoints, the fix ships in
        # a new yfinance release. Schema validation below guards against drift.
        run: python -m pip install --upgrade pip yfinance

      - name: Fetch candles and fundamentals
        run: python scripts/fetch_fundamentals.py

      - name: Validate the snapshot
        run: python scripts/fetch_fundamentals.py --validate-only

      - name: Commit the refreshed snapshot
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/market_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh market snapshot ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

  deploy:
    name: Deploy to GitHub Pages
    needs: refresh
    # Deploy when the refresh succeeded or was skipped (push events). If the refresh
    # failed, the live site is left untouched and keeps serving yesterday's data.
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch (including the fresh snapshot)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Assemble the static site
        run: |
          mkdir -p _site
          for item in index.html styles src data tests; do
            if [ -e "$item" ]; then
              cp -r "$item" _site/
            fi
          done
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
