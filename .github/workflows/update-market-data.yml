name: Update market data and deploy

# Three jobs, one rule: nothing reaches the live site without passing the tests.
#
#   refresh  Scheduled and manual runs. Fetches data, validates it, runs the
#            pipeline unit tests and the browser test suite against the NEW
#            snapshot, and only then commits it. If any step fails the job stops:
#            nothing is committed, nothing is deployed, and the site keeps serving
#            yesterday's data. Last, whatever happened, it sends the daily
#            Telegram briefing (top signals, headline-tone shifts, run status).
#            The briefing can never fail the job or block the deployment.
#   test     Pushes and pull requests. Runs the same two test suites against the
#            code as pushed.
#   deploy   Publishes to GitHub Pages. Runs only after a successful refresh, or
#            after a successful test on a push to the default branch.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Optional: repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID turn on the
# daily briefing. Without them the briefing step does nothing.

on:
  schedule:
    # 22:30 UTC every day (06:30 SGT). After the US close in both EST and EDT,
    # and long after the SGX close. Runs at weekends too, for crypto candles.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: "Test and deploy the site without refreshing market data"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Serialise runs that touch the default branch; let pull requests run alongside.
  group: market-data-${{ github.event_name == 'pull_request' && github.ref || 'default-branch' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Runs the site's own engines for the briefing's signals (scripts/signals.mjs).
  NODE_VERSION: "22"

jobs:
  refresh:
    name: Refresh market snapshot
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_refresh)
    runs-on: ubuntu-latest
    # Budget: about 30 tickers at 2-3 seconds each, news, and (from Batch 5) two model
    # fits per ticker. The script enforces its own 12-minute data budget; this is the backstop.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Keep the previous snapshot for the briefing
        run: cp data/market_snapshot.json "$RUNNER_TEMP/previous_snapshot.json" || true

      - name: Fetch candles, fundamentals, news and macro data
        id: fetch
        run: python scripts/fetch_fundamentals.py

      - name: Validate the snapshot schema
        id: validate
        run: python scripts/fetch_fundamentals.py --validate-only

      - name: "Gate 1: pipeline unit tests"
        id: gate1
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: "Gate 2: browser test suite against the new snapshot"
        id: gate2
        run: python scripts/run_browser_tests.py --min-tests 100

      - name: Commit the refreshed snapshot
        id: commit
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/market_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh market snapshot ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      # Runs whatever happened above, so a failed run is reported too. The secrets are
      # given to this step alone, never to the steps that run third-party data code.
      # The script always exits 0, and continue-on-error is the second line of defence.
      - name: Send the daily Telegram briefing
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUANTLENS_FETCH: ${{ steps.fetch.outcome }}
          QUANTLENS_VALIDATE: ${{ steps.validate.outcome }}
          QUANTLENS_GATE1: ${{ steps.gate1.outcome }}
          QUANTLENS_GATE2: ${{ steps.gate2.outcome }}
          QUANTLENS_COMMIT: ${{ steps.commit.outcome }}
        run: python scripts/fetch_fundamentals.py --notify --previous "$RUNNER_TEMP/previous_snapshot.json"

  test:
    name: Test
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Validate the committed snapshot
        run: python scripts/fetch_fundamentals.py --validate-only

      - name: Pipeline unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Browser test suite
        run: python scripts/run_browser_tests.py --min-tests 100

  deploy:
    name: Deploy to GitHub Pages
    needs: [refresh, test]
    # Deploy when the refresh passed its gates, or when it did not run and the test
    # job passed. A failed gate leaves the live site untouched. Never on pull requests.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          (needs.refresh.result == 'success' ||
           (needs.refresh.result == 'skipped' && needs.test.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch (including the fresh snapshot)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Assemble the static site
        run: |
          mkdir -p _site
          for item in index.html styles src data tests; do
            if [ -e "$item" ]; then
              cp -r "$item" _site/
            fi
          done
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
